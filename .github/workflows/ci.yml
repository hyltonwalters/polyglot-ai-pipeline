name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest
        working-directory: IngestionService
        run: python -m pytest -q

  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        working-directory: ConcurrencyEngine
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: ConcurrencyEngine
        run: go vet ./...

      - name: Test
        working-directory: ConcurrencyEngine
        run: go test -race -cover ./...

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [python-tests, go-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build local services
        run: docker compose build --pull

      - name: Build Render demo image
        run: docker build --pull -f Dockerfile.render -t polyglot-render-demo .

  integration:
    name: Docker Compose integration test
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for ingestion service
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/healthz >/dev/null; then
              echo "Ingestion service is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Ingestion service did not become healthy"
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Test end-to-end ingestion
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -X POST \
            http://localhost:8000/api/v1/ingest \
            -d '{"products":[{"id":101,"title":"Trail Boots","raw_description":"Waterproof hiking boots"},{"id":102,"title":"Laptop","raw_description":"Portable computer"},{"id":103,"title":"Jacket","raw_description":"Lightweight outdoor jacket"}]}')"

          echo "$response"
          RESPONSE="$response" python - <<'PY'
          import json
          import os

          data = json.loads(os.environ["RESPONSE"])
          assert data["status"] == "completed", data
          assert data["processed"] == 3, data
          assert data["failed"] == 0, data
          assert [item["product"]["id"] for item in data["results"]] == [101, 102, 103], data
          assert data["results"][0]["enrichment"]["category"] == "footwear", data
          assert data["results"][1]["enrichment"]["category"] == "electronics", data
          assert data["results"][2]["enrichment"]["category"] == "apparel", data
          PY

      - name: Dump service state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down -v
