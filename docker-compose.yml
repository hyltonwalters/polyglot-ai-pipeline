services:
  ingestion:
    build:
      context: .
      target: ingestion
    ports:
      - "8000:8000"
    environment:
      WORKER_URL: http://worker:8080/v1/process-batch
    depends_on:
      worker:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    environment:
      AI_MODE: ${AI_MODE:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      MAX_WORKERS: ${MAX_WORKERS:-4}
      JOB_TIMEOUT_MS: ${JOB_TIMEOUT_MS:-5000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10
